<svg xmlns="http://www.w3.org/2000/svg" width="840" height="290" viewBox="0 0 840 290" role="img" aria-labelledby="title"><title id="title">Touchard&#x27;s product identity maps sign choices to M8, M0 and two copies of M4.</title><rect width="100%" height="100%" fill="white"/>
<text x="16.00" y="28.00" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#192b3b" font-weight="600">Fix the first sign; combine opposite sums</text>
<text x="304.00" y="80.00" font-family="Arial,sans-serif" font-size="16" text-anchor="end" fill="#192b3b" font-weight="400">+2 +2 +4</text>
<line x1="320.00" y1="75.00" x2="580.00" y2="80.00" stroke="#2869a6" stroke-width="1.8"/>
<text x="304.00" y="128.00" font-family="Arial,sans-serif" font-size="16" text-anchor="end" fill="#192b3b" font-weight="400">+2 +2 −4</text>
<line x1="320.00" y1="123.00" x2="580.00" y2="140.00" stroke="#2869a6" stroke-width="1.8"/>
<text x="304.00" y="176.00" font-family="Arial,sans-serif" font-size="16" text-anchor="end" fill="#192b3b" font-weight="400">+2 −2 +4</text>
<line x1="320.00" y1="171.00" x2="580.00" y2="210.00" stroke="#2869a6" stroke-width="1.8"/>
<text x="304.00" y="224.00" font-family="Arial,sans-serif" font-size="16" text-anchor="end" fill="#192b3b" font-weight="400">+2 −2 −4</text>
<line x1="320.00" y1="219.00" x2="580.00" y2="210.00" stroke="#2869a6" stroke-width="1.8"/>
<text x="590.00" y="85.00" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#192b3b" font-weight="400">M₈ = 4738</text>
<text x="590.00" y="145.00" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#192b3b" font-weight="400">M₀ = 2</text>
<text x="590.00" y="215.00" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#192b3b" font-weight="400">M₄ = 2</text>
<text x="420.00" y="271.00" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#192b3b" font-weight="400">4738 + 2 + 2 × 2 = 4744</text>
</svg>
